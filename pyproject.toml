[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xmetai-evaluation"
version = "0.1.0"
description = "气象模型评测框架 - 离线评测已推理完成的模型输出"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "沈哲文"},
    {name = "刘子航"},
    {name = "安达维"},
    {name = "周辰光"},
    {name = "王晨鹏"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.20",
    "xarray>=2022.3.0",
    "pandas>=1.3",
    "scipy>=1.10",
    "pyyaml>=5.4",
    "tqdm>=4.60",
]

[project.optional-dependencies]
grib = [
    "cfgrib>=0.9.10",
    "eccodes>=1.4",
]
viz = [
    "matplotlib>=3.5",
    "cartopy>=0.20",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "netcdf4>=1.6",
    "ruff>=0.0.250",
]

[project.scripts]
xmetai-eval = "xmetai_evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["xmetai_evaluation*"]
exclude = ["tests*", "ref*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "realdata: 需要本机真实数据（BABJ / 预报 / 归档），未配置环境变量时自动跳过",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I"]
